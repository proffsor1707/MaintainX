kind = "web"
previewPath = "/"
title = "Predictive Maintenance Dashboard"
description = "A predictive software maintenance control center that analyzes repository health, ranks at-risk modules, forecasts maintenance load, and turns code metrics into actionable refactoring guidance."
version = "1.0.0"
id = "artifacts/maintenance-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20875

[services.development]
run = "pnpm --filter @workspace/maintenance-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maintenance-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/maintenance-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20875"
BASE_PATH = "/"
