[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-failure-risk-ml"
version = "0.1.0"
description = "Reproducible software failure-risk training pipeline"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<4.0",
  "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
[tool.vercel]
entrypoint = "backend.app.main:app"